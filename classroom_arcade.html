<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>课间游戏厅 · 双人联机</title>
<style>
:root{--bg:#101522;--panel:#1a2335;--panel2:#222e45;--line:#34435f;--text:#edf3ff;--muted:#9eacc5;--a:#61d6c5;--b:#ffbd69;--danger:#ff7185}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 20% 0%,#23314b 0,#101522 48%);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh}
main{max-width:1100px;margin:auto;padding:24px 18px 48px}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
h1{font-size:clamp(26px,5vw,40px);margin:0;letter-spacing:-1px}.sub{color:var(--muted);margin:4px 0 0}.tag{border:1px solid var(--line);padding:6px 10px;border-radius:99px;color:var(--a);font-size:12px}
.layout{display:grid;grid-template-columns:310px 1fr;gap:16px;margin-top:20px}.panel{background:linear-gradient(160deg,#1d2940,#171f30);border:1px solid var(--line);border-radius:18px;padding:17px;box-shadow:0 12px 30px #0003}
h2{font-size:17px;margin:0 0 12px}label{display:block;color:var(--muted);font-size:12px;margin:12px 0 5px}
input,select,button{font:inherit}input,select{width:100%;background:#101827;border:1px solid var(--line);border-radius:10px;padding:11px;color:var(--text);outline:none}
button{border:0;border-radius:10px;padding:10px 13px;cursor:pointer;font-weight:700;background:var(--a);color:#10202a;transition:.15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.secondary{background:#2c3a54;color:var(--text);border:1px solid var(--line)}button.warn{background:#ffd08a;color:#33220c}button:disabled{opacity:.45;cursor:not-allowed;transform:none}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.status{margin-top:12px;padding:10px;border-radius:10px;background:#101827;color:var(--muted);font-size:13px;min-height:42px}.status.good{color:var(--a)}.status.bad{color:var(--danger)}
.roomcode{font:700 18px ui-monospace,monospace;letter-spacing:1px;color:var(--b);word-break:break-all}
.games{display:grid;grid-template-columns:repeat(2,1fr);gap:9px}.game{background:#121b2b;border:1px solid var(--line);border-radius:13px;padding:12px;text-align:left;color:var(--text);cursor:pointer}.game strong{display:block;font-size:14px}.game small{color:var(--muted)}.game.active{border-color:var(--a);box-shadow:inset 0 0 0 1px var(--a)}
.game:disabled{opacity:.5;cursor:not-allowed}.arena{min-width:0}.arenahead{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:12px;flex-wrap:wrap}.scores{display:flex;gap:10px;color:var(--muted);font-size:13px}.scores b{color:var(--text)}
canvas{width:100%;aspect-ratio:16/9;display:block;background:#0b1220;border:1px solid #3a4964;border-radius:14px;touch-action:none}
.help{display:flex;justify-content:space-between;gap:14px;flex-wrap:wrap;color:var(--muted);font-size:12px;margin-top:10px}
.controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.controls button{background:#2a3852;color:var(--text);border:1px solid var(--line);min-width:48px}
.note{color:var(--muted);font-size:12px;margin-top:12px}.footer{margin-top:16px;color:#8291aa;font-size:12px}
@media(max-width:800px){.layout{grid-template-columns:1fr}.games{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<main>
  <div class="top">
    <div><h1>🎮 课间游戏厅</h1><p class="sub">CLASSROOM ARCADE · 双人在线试玩版</p></div>
    <span class="tag">第一版 · 免费原型</span>
  </div>
  <div class="layout">
    <aside class="panel">
      <h2>连接房间</h2>
      <label>你的昵称</label><input id="nickname" maxlength="14" value="玩家">
      <div class="actions">
        <button id="create">创建房间</button>
        <button id="copy" class="secondary" disabled>复制房间码</button>
      </div>
      <label>加入同桌的房间码</label><input id="joincode" placeholder="输入对方的房间码">
      <button id="join" class="secondary" style="width:100%;margin-top:8px">加入房间</button>
      <div class="status" id="status">尚未连接。一个人创建房间，另一个人输入房间码加入。</div>
      <label>当前房间码</label><div class="roomcode" id="roomcode">——</div>
      <p class="note">联机使用 PeerJS / WebRTC。双方都需要能访问国际网络；首次连接可能需要几秒钟。</p>
      <hr style="border:0;border-top:1px solid var(--line);margin:16px 0">
      <h2>选择游戏</h2>
      <div class="games">
        <button class="game active" data-game="tank"><strong>🚜 坦克对战</strong><small>移动、躲避、发射彩色弹丸</small></button>
        <button class="game" data-game="space"><strong>🚀 太空对战</strong><small>双飞船竞技</small></button>
        <button class="game" data-game="territory"><strong>🗺️ 领土争夺</strong><small>占领地图上的据点</small></button>
        <button class="game" data-game="race"><strong>🏁 双人竞速</strong><small>冲向终点，避开障碍</small></button>
      </div>
      <button id="start" class="warn" style="width:100%;margin-top:12px" disabled>开始 / 重开本局</button>
      <p class="note">只有房主可以切换游戏和开始新一局。游戏采用卡通抽象效果，不含写实暴力内容。</p>
    </aside>
    <section class="panel arena">
      <div class="arenahead">
        <div><h2 id="gametitle">🚜 坦克对战</h2><div class="sub" id="gamestatus">等待两名玩家连接</div></div>
        <div class="scores"><span>你：<b id="myscore">0</b></span><span>对手：<b id="opscore">0</b></span></div>
      </div>
      <canvas id="game" width="960" height="540"></canvas>
      <div class="help"><span>移动：W A S D 或方向键</span><span>技能：空格键（竞速模式不需要）</span><span>手机/触屏：使用下方按钮</span></div>
      <div class="controls">
        <button data-key="ArrowUp">▲</button><button data-key="ArrowLeft">◀</button><button data-key="ArrowDown">▼</button><button data-key="ArrowRight">▶</button><button data-key=" ">技能 / 发射</button>
      </div>
      <div class="footer">提示：两台电脑各自控制自己的角色。建议先由一人创建房间，再把房间码发给同桌。</div>
    </section>
  </div>
</main>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script>
(() => {
const $=id=>document.getElementById(id), canvas=$('game'),ctx=canvas.getContext('2d');
const W=960,H=540, colors=['#61d6c5','#ffbd69'];
let peer=null,conn=null,isHost=false,connected=false,roomId='',role=0,game='tank',state=null,keys={},lastSend=0,raf=0;
const names={tank:'🚜 坦克对战',space:'🚀 太空对战',territory:'🗺️ 领土争夺',race:'🏁 双人竞速'};
function status(msg,type=''){ $('status').textContent=msg;$('status').className='status '+type; }
function send(data){if(conn&&conn.open)conn.send(data)}
function makePeer(){return new Promise((resolve,reject)=>{peer=new Peer(undefined,{debug:0});peer.on('open',id=>resolve(id));peer.on('error',e=>reject(e));peer.on('disconnected',()=>status('网络连接中断，尝试重新连接…','bad'));});}
function setConnected(){connected=true;$('start').disabled=!isHost;document.querySelectorAll('.game').forEach(b=>b.disabled=!isHost);status('已连接！你们可以开始游戏了。','good');$('gamestatus').textContent='两名玩家已就位';}
function initState(){return {game,started:true,over:false,winner:-1,score:[0,0],players:[{x:180,y:270,a:0,hp:3,lap:0},{x:780,y:270,a:Math.PI,hp:3,lap:0}],bullets:[],nodes:[{x:300,y:170,owner:-1,hold:0},{x:480,y:270,owner:-1,hold:0},{x:660,y:370,owner:-1,hold:0}],obstacles:Array.from({length:9},(_,i)=>({x:260+(i%3)*220,y:140+Math.floor(i/3)*130,r:20}))};}
function hostStart(){if(!isHost||!connected)return;state=initState();game=state.game;send({type:'state',state});$('gamestatus').textContent='进行中 · '+names[game];}
function chooseGame(g){if(!isHost)return;game=g;document.querySelectorAll('.game').forEach(b=>b.classList.toggle('active',b.dataset.game===g));$('gametitle').textContent=names[g];if(connected)send({type:'game',game:g});state=null;draw();}
document.querySelectorAll('.game').forEach(b=>b.onclick=()=>chooseGame(b.dataset.game));
$('create').onclick=async()=>{try{$('create').disabled=true;status('正在创建房间…');isHost=true;role=0;roomId=await makePeer();$('roomcode').textContent=roomId;$('copy').disabled=false;status('房间已创建。把房间码发给同桌，等待加入。','good');peer.on('connection',c=>{if(conn){c.close();return;}conn=c;wire();});$('start').disabled=true;}catch(e){status('创建失败：'+e.message,'bad');$('create').disabled=false;}};
$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(roomId);status('房间码已复制。','good')}catch(e){status('复制失败，请手动复制房间码。') }};
$('join').onclick=async()=>{const id=$('joincode').value.trim();if(!id)return status('请先输入房间码。','bad');try{$('join').disabled=true;status('正在连接房间…');isHost=false;role=1;await makePeer();conn=peer.connect(id,{reliable:true});wire();}catch(e){status('连接失败：'+e.message,'bad');$('join').disabled=false;}};
function wire(){conn.on('open',()=>{setConnected();send({type:'hello',name:$('nickname').value||'玩家'});if(isHost)send({type:'game',game});});conn.on('data',m=>{if(!m)return;if(isHost){if(m.type==='input')remoteInput=m.keys||{};}else{if(m.type==='state'){state=m.state;game=state.game;updateGameUI();}if(m.type==='game'){game=m.game;state=null;document.querySelectorAll('.game').forEach(b=>b.classList.toggle('active',b.dataset.game===game));$('gametitle').textContent=names[game];draw();}if(m.type==='hello')$('gamestatus').textContent='已连接对手：'+m.name;}});conn.on('close',()=>{connected=false;status('对方已断开连接。','bad');$('gamestatus').textContent='等待对手重新连接';});}
let remoteInput={};
const localInput={};
function keyName(k){return k===' '||k==='Spacebar'?' ':k;}
window.addEventListener('keydown',e=>{const k=keyName(e.key);if(['ArrowUp','ArrowDown','ArrowLeft','ArrowRight',' '].includes(k))e.preventDefault();keys[k]=true;});
window.addEventListener('keyup',e=>{keys[keyName(e.key)]=false;});
window.addEventListener('blur',()=>keys={});
document.querySelectorAll('[data-key]').forEach(b=>{const k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',down);['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,up));});
function getInput(){return {up:!!(keys.w||keys.W||keys.ArrowUp),down:!!(keys.s||keys.S||keys.ArrowDown),left:!!(keys.a||keys.A||keys.ArrowLeft),right:!!(keys.d||keys.D||keys.ArrowRight),fire:!!keys[' ']};}
function clamp(v,a,b){return Math.max(a,Math.min(b,v))}
function update(dt){
 if(!state||!state.started||state.over)return;
 const inputs=[isHost?getInput():remoteInput,isHost?remoteInput:getInput()];
 for(let i=0;i<2;i++){
  const p=state.players[i],inp=inputs[i]||{},speed=game==='race'?260:210;
  let dx=(inp.right?1:0)-(inp.left?1:0),dy=(inp.down?1:0)-(inp.up?1:0);
  if(dx||dy){const len=Math.hypot(dx,dy);dx/=len;dy/=len;p.x+=dx*speed*dt;p.y+=dy*speed*dt;p.a=Math.atan2(dy,dx);}
  p.x=clamp(p.x,28,W-28);p.y=clamp(p.y,35,H-35);
  if(game==='tank'||game==='space'){
   p.cool=(p.cool||0)-dt;
   if(inp.fire&&p.cool<=0){state.bullets.push({x:p.x+Math.cos(p.a)*24,y:p.y+Math.sin(p.a)*24,vx:Math.cos(p.a)*440,vy:Math.sin(p.a)*440,owner:i,life:1.8});p.cool=.45;}
  }
  if(game==='race'){p.lap+=Math.max(0,dx)*dt*0.7;if(p.x>W-65&&p.y>190&&p.y<350){p.lap+=dt*2;}if(p.lap>=4){state.over=true;state.winner=i;}}
 }
 state.bullets=state.bullets.filter(b=>{b.x+=b.vx*dt;b.y+=b.vy*dt;b.life-=dt;if(b.life<=0||b.x<0||b.x>W||b.y<0||b.y>H)return false;for(let i=0;i<2;i++){if(i!==b.owner){const p=state.players[i];if(Math.hypot(p.x-b.x,p.y-b.y)<22){p.hp--;if(p.hp<=0){state.over=true;state.winner=b.owner;}return false;}}}return true;});
 if(game==='territory'){for(const n of state.nodes){for(let i=0;i<2;i++){const p=state.players[i];if(Math.hypot(p.x-n.x,p.y-n.y)<55){n.hold+=dt*(i===0?1:-1);if(n.hold>2){n.owner=0;n.hold=2;}if(n.hold< -2){n.owner=1;n.hold=-2;}}} }state.score=[state.nodes.filter(n=>n.owner===0).length,state.nodes.filter(n=>n.owner===1).length];if(state.score[0]>=2||state.score[1]>=2){state.over=true;state.winner=state.score[0]>=2?0:1;}}
 if(game==='race'){state.score=state.players.map(p=>Math.floor(p.lap*25));}
}
function roundRect(x,y,w,h,r){ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill();}
function draw(){
 ctx.clearRect(0,0,W,H);ctx.fillStyle='#0b1220';ctx.fillRect(0,0,W,H);
 ctx.strokeStyle='#1c2a40';ctx.lineWidth=1;for(let x=0;x<W;x+=40){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,H);ctx.stroke()}for(let y=0;y<H;y+=40){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}
 if(!state){ctx.fillStyle='#dce8ff';ctx.textAlign='center';ctx.font='bold 30px system-ui';ctx.fillText('等待开始',W/2,H/2-8);ctx.font='16px system-ui';ctx.fillStyle='#8291aa';ctx.fillText('创建房间并邀请同桌加入',W/2,H/2+25);return;}
 if(game==='race'){ctx.fillStyle='#25334b';roundRect(65,105,830,330,26);ctx.strokeStyle='#657995';ctx.lineWidth=5;ctx.strokeRect(90,130,780,280);ctx.strokeStyle='#9eacc5';ctx.setLineDash([18,15]);ctx.lineWidth=3;ctx.strokeRect(105,145,750,250);ctx.setLineDash([]);ctx.fillStyle='#f4f6fb';ctx.fillRect(835,205,12,130);ctx.fillStyle='#ffbd69';ctx.font='bold 16px system-ui';ctx.fillText('终点',840,190);}
 if(game==='territory'){for(const n of state.nodes){ctx.beginPath();ctx.arc(n.x,n.y,35,0,Math.PI*2);ctx.fillStyle=n.owner<0?'#46546b':colors[n.owner];ctx.fill();ctx.strokeStyle='#eaf2ff';ctx.lineWidth=3;ctx.stroke();ctx.fillStyle='#101522';ctx.textAlign='center';ctx.font='bold 18px system-ui';ctx.fillText('★',n.x,n.y+7);}}
 if(game==='tank'||game==='space'){for(const b of state.bullets){ctx.beginPath();ctx.arc(b.x,b.y,7,0,Math.PI*2);ctx.fillStyle=colors[b.owner];ctx.fill();}}
 state.players.forEach((p,i)=>{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.a);ctx.fillStyle=colors[i];if(game==='tank'){roundRect(-23,-17,46,34,7);ctx.fillStyle='#dce8ff';roundRect(0,-5,31,10,4);ctx.fillStyle='#172338';ctx.beginPath();ctx.arc(0,0,10,0,Math.PI*2);ctx.fill();}else if(game==='space'){ctx.beginPath();ctx.moveTo(27,0);ctx.lineTo(-19,-16);ctx.lineTo(-11,0);ctx.lineTo(-19,16);ctx.closePath();ctx.fill();}else{ctx.beginPath();ctx.arc(0,0,19,0,Math.PI*2);ctx.fill();ctx.fillStyle='#10202a';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText(i===0?'1':'2',0,5);}ctx.restore();});
 ctx.textAlign='left';ctx.font='bold 16px system-ui';ctx.fillStyle=colors[0];ctx.fillText('玩家 1  ♥ '+state.players[0].hp,24,30);ctx.fillStyle=colors[1];ctx.fillText('玩家 2  ♥ '+state.players[1].hp,W-170,30);
 if(state.over){ctx.fillStyle='#08101dcc';ctx.fillRect(0,0,W,H);ctx.textAlign='center';ctx.fillStyle='#fff';ctx.font='bold 38px system-ui';ctx.fillText(state.winner<0?'本局结束':`玩家 ${state.winner+1} 获胜！`,W/2,H/2);ctx.font='17px system-ui';ctx.fillStyle='#c0cbe0';ctx.fillText('房主可以点击“开始 / 重开本局”再来一局',W/2,H/2+38);}
}
function updateGameUI(){if(!state)return;$('myscore').textContent=state.score[role]??0;$('opscore').textContent=state.score[1-role]??0;$('gamestatus').textContent=state.over?`本局结束 · ${state.winner===role?'你赢了！':state.winner===1-role?'对手获胜':'平局'}`:'进行中 · '+names[game];}
let last=performance.now();
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;if(isHost&&connected){update(dt);if(now-lastSend>45){send({type:'state',state});lastSend=now;} }if(!isHost&&connected&&now-lastSend>45){send({type:'input',keys:getInput()});lastSend=now;}if(isHost&&state)updateGameUI();draw();raf=requestAnimationFrame(loop);}
$('start').onclick=hostStart;
$('gametitle').textContent=names[game];
draw();requestAnimationFrame(loop);
})();
</script>
</body>
</html>
